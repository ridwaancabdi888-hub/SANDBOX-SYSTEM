<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#d95a0f" />
    <title>SANDBOX — Offline</title>
    <style>
      :root { color-scheme: light dark; --bg: #f7f5f2; --card: #ffffff; --fg: #1f1a14; --muted: #6b6258; --brand: #d95a0f; }
      @media (prefers-color-scheme: dark) { :root { --bg: #15120e; --card: #1f1b16; --fg: #f4efe8; --muted: #a89e92; --brand: #e4761b; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
             background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { width: 100%; max-width: 360px; text-align: center; background: var(--card); border-radius: 16px; padding: 28px 20px;
             box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 20px; margin: 16px 0 6px; }
      p { margin: 4px 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
      button { margin-top: 20px; min-height: 44px; padding: 0 24px; border: 0; border-radius: 10px; background: var(--brand);
               color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="SANDBOX" />
      <h1>You're offline</h1>
      <p>SANDBOX needs an internet connection to load orders and payments.</p>
      <p lang="so">Internet la&rsquo;aan. Fadlan hubi xiriirkaaga.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
